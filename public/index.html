<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WatchWhere India</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WatchWhere">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14121a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one column, search pinned at top, results as a stacked list, title detail as a sheet. */
:root{
  --bg:#f6f4f9; --surface:#ffffff; --fg:#1b1724; --muted:#6c6678; --line:#e4e0ec;
  --accent:#ff5a36; --accent-ink:#ffffff; --ok:#13865a; --no:#c2342b;
  --imdb:#a87600; --fresh:#d22f1e; --rotten:#4f8a2a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14121a; --surface:#1e1b27; --fg:#f1eef7; --muted:#a29cb0; --line:#2e2a3a;
  --accent:#ff6d4d; --ok:#3ccf8e; --no:#ff7a70;
  --imdb:#f5c518; --fresh:#ff6a55; --rotten:#8fd35c; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:620px;margin:0 auto}
header{padding-block:20px 12px}
h1{font:800 clamp(28px,7vw,40px)/1 var(--display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
form{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:8px}
input{flex:1;min-width:0;font:500 17px var(--body);padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);outline:none}
input:focus{border-color:var(--accent)}
button{font:600 16px var(--body);border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{color:var(--muted);padding:18px 2px}
.list{display:grid;gap:10px;margin-top:6px}
.hit{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:8px;width:100%}
.hit img,.ph{width:56px;height:84px;border-radius:8px;object-fit:cover;background:var(--line)}
.hit b{display:block;font:600 16px var(--body)}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.detail{margin-top:8px}
.top{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.top img{width:110px;border-radius:12px}
.top h2{font:800 26px/1.1 var(--display);margin:0 0 6px;text-wrap:balance}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;margin-top:10px}
.verdict.yes{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.verdict.no{color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.ov{color:var(--muted);font-size:15px;margin:14px 0 0}
section h3{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.app{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;min-width:0}
.app img{width:36px;height:36px;border-radius:9px;flex:none}
.app span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.else li{margin-bottom:4px}
.back{background:none;color:var(--accent);padding:6px 0;font-size:15px}
.ratings{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rate{display:inline-flex;align-items:baseline;gap:5px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-variant-numeric:tabular-nums}
.rate i{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rate.imdb b{color:var(--imdb)}
.rate.rt b{color:var(--fresh)}
.rate.rt.rotten b{color:var(--rotten)}
.homehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 4px}
.homehead h2{font:800 22px/1.1 var(--display);margin:0}
.homehead span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0 12px}
.tabs button{background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:8px 14px;font-size:14px;border-radius:999px}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:28px 64px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;width:100%}
.rec .n{font:800 20px var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rec img,.rec .ph{width:64px;height:96px;border-radius:8px;object-fit:cover;background:var(--line)}
.rec b{display:block;font:600 16px/1.3 var(--body)}
.rec .ratings{margin-top:6px}
.rec .on{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.foot{color:var(--muted);font-size:12px;margin-top:28px}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Watch<span>Where</span></h1>
    <p class="sub">Type a movie or series. See which Indian OTT apps have it.</p>
  </header>

  <form id="f" autocomplete="off">
    <input id="q" type="search" placeholder="e.g. Disclosure Day" aria-label="Movie or series name" enterkeyhint="search">
    <button type="submit">Find</button>
  </form>

  <div id="out"></div>

  <div id="home">
    <div class="homehead"><h2>New &amp; top rated</h2><span>Released in the last 6 months</span></div>
    <div class="tabs" role="group" aria-label="Show">
      <button id="tab-movie" aria-pressed="true">Movies</button>
      <button id="tab-tv" aria-pressed="false">Series</button>
    </div>
    <div id="recs"><p class="status">Loading this week's picks…</p></div>
  </div>

  <p class="foot">Availability from <a href="https://www.justwatch.com/in" target="_blank" rel="noopener">JustWatch</a> via TMDB. Ratings from IMDb and Rotten Tomatoes via OMDb. Catalogues change often; check the app before you pay.</p>
</div>

<script>
const out = document.getElementById("out");
const home = document.getElementById("home");
const q = document.getElementById("q");
let lastResults = [];
let recData = null;
let recTab = "movie";

function showHome() {
  out.innerHTML = "";
  home.hidden = false;
  lastResults = [];
  q.value = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelector("h1").style.cursor = "pointer";
document.querySelector("h1").addEventListener("click", showHome);

// Rating badges: IMDb out of 10, Rotten Tomatoes % (fresh at 60+).
function ratingBadges(r) {
  if (!r || (r.imdb == null && r.rt == null)) return "";
  const imdb = r.imdb != null
    ? `<a class="rate imdb" href="${r.imdbUrl}" target="_blank" rel="noopener"><i>IMDb</i><b>${r.imdb.toFixed(1)}</b></a>` : "";
  const rt = r.rt != null
    ? `<span class="rate rt ${r.rt < 60 ? "rotten" : ""}"><i>Rotten Tomatoes</i><b>${r.rt}%</b></span>` : "";
  return `<div class="ratings">${imdb}${rt}</div>`;
}

function renderRecs() {
  const box = document.getElementById("recs");
  if (!recData) return;
  const list = recTab === "movie" ? recData.movies : recData.series;
  if (!list.length) { box.innerHTML = `<p class="status">No picks found right now. Try again later.</p>`; return; }
  box.innerHTML = `<div class="recs">${list.map((r, i) => `
    <button class="rec" data-i="${i}">
      <span class="n">${i + 1}</span>
      ${r.poster ? `<img src="${r.poster}" alt="" loading="lazy">` : `<div class="ph"></div>`}
      <div>
        <b>${esc(r.title)}</b><span class="tag">${r.type === "tv" ? "Series" : "Movie"}${r.year ? " · " + r.year : ""}</span>
        ${ratingBadges(r.ratings)}
        <span class="on">${r.streamOn.length ? "On " + esc(r.streamOn.join(", ")) : "Not streaming in India yet"}</span>
      </div>
    </button>`).join("")}</div>`;
  box.querySelectorAll(".rec").forEach((b) => b.addEventListener("click", () => {
    lastResults = [];
    openTitle(list[b.dataset.i]);
  }));
}

for (const t of ["movie", "tv"]) {
  document.getElementById("tab-" + t).addEventListener("click", () => {
    recTab = t;
    document.getElementById("tab-movie").setAttribute("aria-pressed", t === "movie");
    document.getElementById("tab-tv").setAttribute("aria-pressed", t === "tv");
    renderRecs();
  });
}

fetch("/api/recommend").then((r) => r.json()).then((j) => {
  if (j.error) throw new Error(j.error);
  recData = j;
  renderRecs();
}).catch(() => {
  document.getElementById("recs").innerHTML = `<p class="status">Couldn't load picks. Search still works.</p>`;
});

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const status = (t) => (out.innerHTML = `<p class="status">${esc(t)}</p>`);

async function api(path) {
  const r = await fetch(path);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
  return j;
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const term = q.value.trim();
  if (!term) return;
  q.blur();
  home.hidden = true;
  status("Searching…");
  try {
    const { results } = await api(`/api/search?q=${encodeURIComponent(term)}`);
    lastResults = results;
    if (!results.length) return status(`No movie or series called "${term}" found. Check the spelling.`);
    if (results.length === 1) return openTitle(results[0]);
    renderList();
  } catch (err) { status(err.message); }
});

function renderList() {
  out.innerHTML = `<p class="status" style="padding-bottom:4px">Pick the right one:</p><div class="list">${lastResults.map((r, i) => `
    <button class="hit" data-i="${i}">
      ${r.poster ? `<img src="${r.poster}" alt="" loading="lazy">` : `<div class="ph"></div>`}
      <div><b>${esc(r.title)}</b><span class="tag">${r.type === "tv" ? "Series" : "Movie"}${r.year ? " · " + r.year : ""}</span></div>
    </button>`).join("")}</div>`;
  out.querySelectorAll(".hit").forEach((b) => b.addEventListener("click", () => openTitle(lastResults[b.dataset.i])));
}

const appCards = (list) => `<div class="apps">${list.map((p) => `
  <a class="app" href="${p.url}" target="_blank" rel="noopener">
    ${p.logo ? `<img src="${p.logo}" alt="">` : ""}<span>${esc(p.name)}</span>
  </a>`).join("")}</div>`;

async function openTitle(r) {
  home.hidden = true;
  status(`Checking where to watch ${r.title}…`);
  try {
    const t = await api(`/api/title?type=${r.type}&id=${r.id}`);
    const meta = [t.type === "tv" ? "Series" : "Movie", t.year,
      t.runtime ? `${Math.floor(t.runtime/60)}h ${t.runtime%60}m` : null,
      t.seasons ? `${t.seasons} season${t.seasons > 1 ? "s" : ""}` : null, ...t.genres].filter(Boolean).join(" · ");
    const sections = [
      ["Stream with subscription", t.india.stream],
      ["Free", t.india.free],
      ["Rent", t.india.rent],
      ["Buy", t.india.buy],
    ].filter(([, l]) => l.length).map(([h, l]) => `<section><h3>${h}</h3>${appCards(l)}</section>`).join("");

    const notIn = !t.availableInIndia ? `
      ${t.releaseNote ? `<div class="note">${esc(t.releaseNote)}</div>` : ""}
      ${t.elsewhere.length ? `<section><h3>Streaming outside India</h3><ul class="else">${t.elsewhere.map((e) =>
        `<li><b>${esc(e.country)}:</b> ${esc(e.apps.join(", "))}</li>`).join("")}</ul></section>` : ""}` : "";

    out.innerHTML = `<div class="detail">
      <button class="back" id="home-btn">← Home</button>
      ${lastResults.length > 1 ? `<button class="back" id="back" style="margin-left:16px">Other matches</button>` : ""}
      <div class="top">
        ${t.poster ? `<img src="${t.poster}" alt="Poster of ${esc(t.title)}">` : `<div class="ph" style="width:110px;height:165px"></div>`}
        <div>
          <h2>${esc(t.title)}</h2>
          <span class="tag">${esc(meta)}</span><br>
          ${ratingBadges(t.ratings)}
          <span class="verdict ${t.availableInIndia ? "yes" : "no"}">${t.availableInIndia ? "● Available in India" : "● Not available in India"}</span>
        </div>
      </div>
      ${sections}${notIn}
      ${t.overview ? `<p class="ov">${esc(t.overview)}</p>` : ""}
    </div>`;
    document.getElementById("back")?.addEventListener("click", renderList);
    document.getElementById("home-btn").addEventListener("click", showHome);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) { status(err.message); }
}
</script>
</body>
</html>
