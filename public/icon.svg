<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset=".55" stop-color="#170c08"/>
      <stop offset="1" stop-color="#0a0605"/>
    </radialGradient>
    <linearGradient id="beam" x1="96" y1="96" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2b06a"/>
      <stop offset=".45" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#c8321f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft glow behind the mark -->
  <g opacity=".55" filter="url(#glow)">
    <circle cx="228" cy="228" r="116" fill="none" stroke="url(#beam)" stroke-width="30"/>
    <path d="M314 314 L388 388" stroke="url(#beam)" stroke-width="40" stroke-linecap="round"/>
  </g>
  <!-- lens ring with a gap, like a scanning aperture -->
  <path d="M228 112 A116 116 0 1 1 146 146" fill="none" stroke="url(#beam)" stroke-width="30" stroke-linecap="round"/>
  <!-- handle -->
  <path d="M314 314 L388 388" stroke="url(#beam)" stroke-width="40" stroke-linecap="round"/>
  <!-- play glyph -->
  <path d="M206 178 Q206 166 217 172 L284 214 Q294 221 284 228 L217 270 Q206 276 206 264 Z" fill="#fff"/>
  <!-- signal dot in the aperture gap -->
  <circle cx="176" cy="120" r="13" fill="#f2b06a"/>
</svg>
